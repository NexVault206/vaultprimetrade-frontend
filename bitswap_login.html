<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BitSwapTrade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0A0A0A; font-family: 'Inter', sans-serif; color: #fff; min-height: 100vh; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #1f1f1f; }
        .topbar-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .topbar-logo { width: 30px; height: 30px; }
        .topbar-brand span { font-size: 1.25rem; font-weight: 800; color: #fff; }
        .topbar-brand span b { color: #10B981; }
        .container { max-width: 440px; margin: 0 auto; padding: 60px 24px 60px; }
        h1 { font-size: 2.1rem; font-weight: 800; margin-bottom: 8px; }
        .sub { color: #9ca3af; margin-bottom: 30px; font-size: 0.95rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #d1d5db; }
        .field { margin-bottom: 18px; }
        input { width: 100%; padding: 14px 16px; background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; transition: border 0.2s; }
        input::placeholder { color: #6b7280; }
        input:focus { border-color: #10B981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
        .google-btn { background: #fff; color: #111; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px; }
        .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; color: #6b7280; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #262626; }
        .turnstile-wrap { margin: 8px 0 20px; display: flex; justify-content: center; }
        button { width: 100%; background: #10B981; padding: 15px; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; margin-top: 6px; cursor: pointer; transition: opacity 0.2s; color: #06120d; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg-box { padding: 12px 16px; border-radius: 12px; margin-top: 14px; font-size: 0.9rem; display: none; line-height: 1.4; }
        .msg-box.error { background: #2a1515; color: #f87171; display: block; }
        .msg-box.success { background: #10291f; color: #4ade80; display: block; }
        .msg-box.info { background: #1a263a; color: #93c5fd; display: block; }
        .links { text-align: center; margin-top: 24px; color: #9ca3af; font-size: 0.9rem; }
        .links a { color: #10B981; text-decoration: none; font-weight: 600; margin: 0 8px; }
        .links a:hover { text-decoration: underline; }
        .back-home { text-align: center; margin-top: 20px; }
        .back-home a { color: #6b7280; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <a class="topbar-brand" href="bitswap_index.html">
            <svg class="topbar-logo" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#10B981"/>
                <path d="M2 12l10 5 10-5" stroke="#10B981" stroke-width="2" fill="none"/>
            </svg>
            <span><b>BitSwap</b>Trade</span>
        </a>
    </div>

    <div class="container">
        <h1>Welcome back</h1>
        <p class="sub">Login to your BitSwapTrade account</p>

        <button type="button" class="btn google-btn" id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
            Sign in with Google
        </button>

        <div class="divider">or sign in with email</div>

        <div class="field">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="email">
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        </div>

        <div class="turnstile-wrap">
            <div class="h-captcha" data-sitekey="5b2ebb1c-be3c-4c28-8fc4-f19e270cbda4" data-callback="onLoginCaptchaSuccess" data-theme="dark"></div>
        </div>
        <script>let loginCaptchaToken = null; function onLoginCaptchaSuccess(token) { loginCaptchaToken = token; }</script>

        <div class="msg-box" id="msgBox"></div>
        <button id="loginBtn">Login</button>

        <div class="links">
            <a href="bitswap_createaccount.html">Create account</a> |
            <a href="#" id="forgotLink">Forgot Password?</a>
        </div>
        <div class="back-home"><a href="bitswap_index.html">← Back to Home</a></div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const SUPABASE_URL = 'https://wzphhuaxrgxprjysxzup.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Im30ly7e7WKp8xu-RRxDww_11U0ixuq';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('Supabase client created (login)');

        const emailInput = document.getElementById('loginEmail');
        const passInput = document.getElementById('loginPassword');
        const btn = document.getElementById('loginBtn');
        const msgBox = document.getElementById('msgBox');

        // Handle logout param or check session
        (async function checkSession() {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('logout') === '1') {
                    await supabase.auth.signOut();
                    window.history.replaceState({}, '', window.location.pathname);
                    return;
                }
                const { data: { session } } = await supabase.auth.getSession();
                if (session) window.location.href = 'bitswap_dashboard.html';
            } catch (e) {
                console.warn('Session check error:', e);
            }
        })();

        function showMessage(text, type = 'error') {
            msgBox.className = 'msg-box ' + type;
            msgBox.textContent = text;
            msgBox.style.display = 'block';
        }
        function hideMessage() {
            msgBox.style.display = 'none';
            msgBox.className = 'msg-box';
        }

        async function handleLogin() {
            console.log('Login button clicked');
            hideMessage();
            const email = emailInput.value.trim();
            const password = passInput.value;

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                if (!loginCaptchaToken) { btn.disabled = false; btn.textContent = 'Login'; return showMessage('Please complete the human verification.', 'error'); }
                const { data, error } = await supabase.auth.signInWithPassword({ email, password, options: { captchaToken: loginCaptchaToken } });

                if (error) {
                    if (error.message && error.message.toLowerCase().includes('email not confirmed')) {
                        return showMessage('Email not confirmed. Please contact support.', 'error');
                    }
                    if (error.message && error.message.toLowerCase().includes('invalid login')) {
                        return showMessage('Invalid email or password. Please try again.', 'error');
                    }
                    return showMessage(error.message, 'error');
                }

                window.location.href = 'bitswap_dashboard.html';

            } catch (err) {
                console.error(err);
                if (err.message && err.message.toLowerCase().includes('failed to fetch')) {
                    showMessage('No internet connection. Please check your network and try again.', 'error');
                } else {
                    showMessage('Unexpected error. Please try again.', 'error');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        document.getElementById('googleBtn').addEventListener('click', async function() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/bitswap_dashboard.html' }
            });
            if (error) showMessage('Google sign-in error: ' + error.message, 'error');
        });

        btn.addEventListener('click', handleLogin);
        document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
        document.getElementById('forgotLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'bitswap_forgot.html';
        });

        (function checkUrlParam() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('verified') === 'pending') {
                showMessage('Your account is created. Please verify your email before logging in.', 'info');
            }
        })();

    });
</script>
</body>
</html>
