<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>BitSwap | Swap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    padding: 20px 16px 100px 16px;
    transition: background 0.3s, color 0.2s;
}
:root {
    --bg-primary: #0D0D0D;
    --bg-secondary: #111111;
    --bg-card: #111111;
    --bg-elevated: #141414;
    --border: #1f1f1f;
    --text-primary: #EFF3FC;
    --text-secondary: #94A3B8;
    --accent: #10B981;
    --success: #2BE07E;
    --danger: #FF4D4D;
    --shadow: none;
}
body.light {
    --bg-primary: #F8F9FC;
    --bg-secondary: #FFFFFF;
    --bg-card: #FFFFFF;
    --bg-elevated: #F0F2F7;
    --border: #E8ECF1;
    --text-primary: #1A1D2E;
    --text-secondary: #5A6478;
    --accent: #059669;
    --success: #10B981;
    --danger: #EF4444;
    --shadow: 0 4px 20px rgba(0,0,0,0.04);
}
.app-container { max-width: 620px; margin: 0 auto; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.top-bar .title { font-size: 1.5rem; font-weight: 700; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-primary); cursor: pointer; font-size: 16px; text-decoration: none; }

.holdings-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; }
.holding-chip { flex-shrink: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; min-width: 108px; box-shadow: var(--shadow); }
.holding-chip .sym { font-weight: 700; font-size: 0.9rem; }
.holding-chip .amt { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
.holding-chip .usd { font-size: 0.75rem; color: var(--text-secondary); }

.swap-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 28px; padding: 22px; box-shadow: var(--shadow); }
.swap-label { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.swap-row { display: flex; align-items: center; gap: 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; }
.swap-row select { background: transparent; border: none; color: var(--text-primary); font-weight: 700; font-size: 1rem; outline: none; }
.swap-row input { flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 1.3rem; font-weight: 700; outline: none; text-align: right; width: 100%; }
.swap-divider { display: flex; justify-content: center; margin: 4px 0; }
.swap-flip-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; border: 3px solid var(--bg-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; margin: -14px 0; z-index: 2; position: relative; }
.rate-line { text-align: center; font-size: 0.8rem; color: var(--text-secondary); margin: 14px 0; }
.max-btn { font-size: 0.7rem; color: var(--accent); font-weight: 600; cursor: pointer; }
.balance-hint { font-size: 0.7rem; color: var(--text-secondary); margin-top: 6px; text-align: right; }
.swap-btn { width: 100%; padding: 16px; border-radius: 40px; background: var(--accent); color: #fff; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
.swap-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.error-msg { color: var(--danger); font-size: 0.8rem; text-align: center; margin-top: 10px; min-height: 18px; }

.history-section { margin-top: 24px; }
.history-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; }
.history-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.85rem; }
.history-item .muted { color: var(--text-secondary); font-size: 0.7rem; }
.empty { text-align: center; color: var(--text-secondary); font-size: 0.85rem; padding: 20px; }

.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); background: var(--bg-primary); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 12px 14px; border-top: 1px solid var(--border); max-width: 600px; margin: 0 auto; width: 100%; border-radius: 32px 32px 0 0; z-index: 100; overflow-x: auto; }
body.light .bottom-nav { background: rgba(255,255,255,0.85); }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); cursor: pointer; text-decoration: none; padding: 4px 6px; border-radius: 12px; flex-shrink: 0; }
.nav-item i { font-size: 20px; }
.nav-item.active { color: var(--accent); }

.toast-msg { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); color: var(--text-primary); padding: 12px 24px; border-radius: 60px; font-size: 14px; z-index: 200; border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,0.3); display: none; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <div class="title"><i class="fas fa-right-left" style="color:var(--accent);"></i> Swap</div>
        <a href="bitswap_dashboard.html" class="icon-btn"><i class="fas fa-arrow-left"></i></a>
    </div>

    <div class="holdings-scroll" id="holdingsScroll">
        <div class="holding-chip"><div class="sym">Loading...</div></div>
    </div>

    <div class="swap-card">
        <div class="swap-label">From</div>
        <div class="swap-row">
            <select id="fromAsset"></select>
            <input type="number" id="fromAmount" placeholder="0.00" min="0" step="any">
        </div>
        <div class="balance-hint">Available: <span id="fromAvail">0.00</span> <span class="max-btn" id="maxBtn">MAX</span></div>

        <div class="swap-divider"><div class="swap-flip-btn" id="flipBtn"><i class="fas fa-arrow-down"></i></div></div>

        <div class="swap-label">To</div>
        <div class="swap-row">
            <select id="toAsset"></select>
            <input type="text" id="toAmount" placeholder="0.00" readonly>
        </div>

        <div class="rate-line" id="rateLine">Fetching live rates...</div>
        <button class="swap-btn" id="swapBtn" disabled>Enter an amount</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="history-section">
        <div class="history-title">Recent Swaps</div>
        <div id="historyList"><div class="empty">Loading...</div></div>
    </div>
</div>

<div class="toast-msg" id="toast"></div>

<div class="bottom-nav">
    <a href="bitswap_dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="bitswap_deposit.html" class="nav-item"><i class="fas fa-arrow-down"></i><span>Deposit</span></a>
    <a href="bitswap_withdraw.html" class="nav-item"><i class="fas fa-arrow-up"></i><span>Withdraw</span></a>
    <a href="bitswap_swap.html" class="nav-item active"><i class="fas fa-right-left"></i><span>Swap</span></a>
    <a href="bitswap_plans.html" class="nav-item"><i class="fas fa-chart-pie"></i><span>Plans</span></a>
    <a href="bitswap_history.html" class="nav-item"><i class="fas fa-clock"></i><span>History</span></a>
    <a href="bitswap_profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
</div>

<script>
// ---------- THEME ----------
(function() {
    if (localStorage.getItem('nexvault_theme') === 'light') document.body.classList.add('light');
})();

// ---------- SUPABASE ----------
const SUPABASE_URL = 'https://wzphhuaxrgxprjysxzup.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Im30ly7e7WKp8xu-RRxDww_11U0ixuq';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- ASSET CONFIG ----------
const ASSETS = {
    USDT: { name: 'Tether', geckoId: 'tether', icon: '₮' },
    BTC:  { name: 'Bitcoin', geckoId: 'bitcoin', icon: '₿' },
    ETH:  { name: 'Ethereum', geckoId: 'ethereum', icon: 'Ξ' },
    BNB:  { name: 'BNB', geckoId: 'binancecoin', icon: '◆' },
    SOL:  { name: 'Solana', geckoId: 'solana', icon: '◎' },
    USDC: { name: 'USD Coin', geckoId: 'usd-coin', icon: '$' }
};
const HOLDING_ASSETS = ['BTC','ETH','BNB','SOL','USDC']; // tracked in user_holdings; USDT lives in profiles.balance

let session = null;
let profile = null;
let holdings = {}; // { BTC: amount, ... }
let prices = {};   // { BTC: usdPrice, ... } always includes USDT: ~1

async function init() {
    const { data: { session: s } } = await sb.auth.getSession();
    if (!s) { window.location.href = 'bitswap_login.html'; return; }
    session = s;

    populateSelects();

    const [{ data: p }, { data: h }] = await Promise.all([
        sb.from('profiles').select('balance').eq('id', session.user.id).single(),
        sb.from('user_holdings').select('asset, amount').eq('user_id', session.user.id)
    ]);
    profile = p || { balance: 0 };
    holdings = {}; HOLDING_ASSETS.forEach(a => holdings[a] = 0);
    (h || []).forEach(row => holdings[row.asset] = parseFloat(row.amount));

    await fetchPrices();
    renderHoldings();
    updateAvailable();
    loadHistory();

    setInterval(fetchPrices, 30000); // refresh rates every 30s
}

function populateSelects() {
    const fromSel = document.getElementById('fromAsset');
    const toSel = document.getElementById('toAsset');
    Object.keys(ASSETS).forEach(sym => {
        fromSel.innerHTML += `<option value="${sym}">${ASSETS[sym].icon} ${sym}</option>`;
        toSel.innerHTML += `<option value="${sym}">${ASSETS[sym].icon} ${sym}</option>`;
    });
    fromSel.value = 'USDT';
    toSel.value = 'BTC';
}

async function fetchPrices() {
    try {
        const ids = Object.values(ASSETS).map(a => a.geckoId).join(',');
        const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);
        const data = await res.json();
        Object.keys(ASSETS).forEach(sym => {
            const gid = ASSETS[sym].geckoId;
            prices[sym] = data[gid] ? data[gid].usd : (sym === 'USDT' || sym === 'USDC' ? 1 : 0);
        });
        renderHoldings();
        computeQuote();
    } catch (e) {
        console.error('Price fetch error:', e);
        document.getElementById('rateLine').textContent = 'Rate service unavailable — try again shortly';
    }
}

function getBalance(asset) {
    if (asset === 'USDT') return parseFloat(profile.balance || 0);
    return holdings[asset] || 0;
}

function renderHoldings() {
    const el = document.getElementById('holdingsScroll');
    const assets = ['USDT', ...HOLDING_ASSETS];
    el.innerHTML = assets.map(sym => {
        const amt = getBalance(sym);
        const usd = amt * (prices[sym] || (sym === 'USDT' ? 1 : 0));
        return `<div class="holding-chip">
            <div class="sym">${ASSETS[sym].icon} ${sym}</div>
            <div class="amt">${amt.toLocaleString(undefined,{maximumFractionDigits:6})}</div>
            <div class="usd">$${usd.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
        </div>`;
    }).join('');
}

function updateAvailable() {
    const from = document.getElementById('fromAsset').value;
    document.getElementById('fromAvail').textContent = getBalance(from).toLocaleString(undefined,{maximumFractionDigits:6}) + ' ' + from;
}

function computeQuote() {
    const from = document.getElementById('fromAsset').value;
    const to = document.getElementById('toAsset').value;
    const amount = parseFloat(document.getElementById('fromAmount').value) || 0;
    const errorEl = document.getElementById('errorMsg');
    const swapBtn = document.getElementById('swapBtn');
    errorEl.textContent = '';

    if (from === to) {
        document.getElementById('rateLine').textContent = 'Choose two different assets';
        document.getElementById('toAmount').value = '';
        swapBtn.disabled = true; swapBtn.textContent = 'Choose different assets';
        return;
    }
    const priceFrom = prices[from], priceTo = prices[to];
    if (!priceFrom || !priceTo) {
        document.getElementById('rateLine').textContent = 'Fetching live rates...';
        swapBtn.disabled = true; swapBtn.textContent = 'Loading rates...';
        return;
    }
    const rate = priceFrom / priceTo;
    document.getElementById('rateLine').textContent = `1 ${from} ≈ ${rate.toLocaleString(undefined,{maximumFractionDigits:6})} ${to}`;

    if (amount <= 0) {
        document.getElementById('toAmount').value = '';
        swapBtn.disabled = true; swapBtn.textContent = 'Enter an amount';
        return;
    }
    const toAmount = amount * rate;
    document.getElementById('toAmount').value = toAmount.toLocaleString(undefined,{maximumFractionDigits:6});

    if (amount > getBalance(from)) {
        errorEl.textContent = `Insufficient ${from} balance`;
        swapBtn.disabled = true; swapBtn.textContent = 'Insufficient balance';
        return;
    }
    swapBtn.disabled = false; swapBtn.textContent = `Swap ${from} → ${to}`;
}

document.getElementById('fromAsset').addEventListener('change', () => { updateAvailable(); computeQuote(); });
document.getElementById('toAsset').addEventListener('change', computeQuote);
document.getElementById('fromAmount').addEventListener('input', computeQuote);
document.getElementById('maxBtn').addEventListener('click', () => {
    const from = document.getElementById('fromAsset').value;
    document.getElementById('fromAmount').value = getBalance(from);
    computeQuote();
});
document.getElementById('flipBtn').addEventListener('click', () => {
    const fromSel = document.getElementById('fromAsset');
    const toSel = document.getElementById('toAsset');
    const tmp = fromSel.value; fromSel.value = toSel.value; toSel.value = tmp;
    updateAvailable(); computeQuote();
});

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

async function executeSwap() {
    const from = document.getElementById('fromAsset').value;
    const to = document.getElementById('toAsset').value;
    const amount = parseFloat(document.getElementById('fromAmount').value) || 0;
    const rate = prices[from] / prices[to];
    const toAmount = amount * rate;

    if (amount <= 0 || amount > getBalance(from)) { showToast('Invalid amount'); return; }

    const swapBtn = document.getElementById('swapBtn');
    swapBtn.disabled = true; swapBtn.innerHTML = '<i class="fas fa-spinner spin"></i> Swapping...';

    try {
        // Debit "from"
        if (from === 'USDT') {
            const newBal = parseFloat(profile.balance || 0) - amount;
            const { error } = await sb.from('profiles').update({ balance: newBal }).eq('id', session.user.id);
            if (error) throw error;
            profile.balance = newBal;
        } else {
            const newAmt = (holdings[from] || 0) - amount;
            const { error } = await sb.from('user_holdings').upsert({ user_id: session.user.id, asset: from, amount: newAmt }, { onConflict: 'user_id,asset' });
            if (error) throw error;
            holdings[from] = newAmt;
        }
        // Credit "to"
        if (to === 'USDT') {
            const newBal = parseFloat(profile.balance || 0) + toAmount;
            const { error } = await sb.from('profiles').update({ balance: newBal }).eq('id', session.user.id);
            if (error) throw error;
            profile.balance = newBal;
        } else {
            const newAmt = (holdings[to] || 0) + toAmount;
            const { error } = await sb.from('user_holdings').upsert({ user_id: session.user.id, asset: to, amount: newAmt }, { onConflict: 'user_id,asset' });
            if (error) throw error;
            holdings[to] = newAmt;
        }
        // Log it
        await sb.from('swap_history').insert({ user_id: session.user.id, from_asset: from, to_asset: to, from_amount: amount, to_amount: toAmount, rate: rate });

        showToast(`✅ Swapped ${amount} ${from} for ${toAmount.toFixed(6)} ${to}`);
        document.getElementById('fromAmount').value = '';
        document.getElementById('toAmount').value = '';
        renderHoldings();
        updateAvailable();
        loadHistory();
        computeQuote();
    } catch (e) {
        console.error('Swap error:', e);
        showToast('Swap failed: ' + e.message);
    }
    swapBtn.disabled = false;
}
document.getElementById('swapBtn').addEventListener('click', executeSwap);

async function loadHistory() {
    const { data, error } = await sb.from('swap_history').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false }).limit(10);
    const el = document.getElementById('historyList');
    if (error || !data || !data.length) { el.innerHTML = '<div class="empty">No swaps yet</div>'; return; }
    el.innerHTML = data.map(h => `
        <div class="history-item">
            <div>
                <div>${h.from_asset} → ${h.to_asset}</div>
                <div class="muted">${new Date(h.created_at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
            </div>
            <div style="text-align:right;">
                <div>-${parseFloat(h.from_amount).toLocaleString(undefined,{maximumFractionDigits:6})} ${h.from_asset}</div>
                <div class="muted">+${parseFloat(h.to_amount).toLocaleString(undefined,{maximumFractionDigits:6})} ${h.to_asset}</div>
            </div>
        </div>
    `).join('');
}

init();
</script>
</body>
</html>
